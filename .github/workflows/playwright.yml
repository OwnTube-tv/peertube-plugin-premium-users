name: Playwright Tests
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Manual runs: lets a fork with its own STRIPE_API_KEY secret run the full
  # E2E suite on any branch — pull_request runs from forks never receive the
  # base repository's secrets, so this is the way to get a real E2E verdict
  # on fork PR changes
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Skip on pull requests from forks: those runs never receive the base
    # repository's secrets, so the suite would only die on an empty
    # STRIPE_API_KEY. The check reports "skipped" instead of a false
    # failure; workflow_dispatch (above) is the way to run the full suite
    # on fork changes.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # Match production: our own web servers and PeerTube mainline both
          # run Node 22
          node-version: 22
      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - name: Cache
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-v2
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci --include=dev && cd demo && npm ci
      - name: Install Playwright Browsers
        working-directory: demo
        run: npx playwright install firefox --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Run docker compose
        working-directory: demo
        run: docker compose up --build --wait
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      - name: Show docker compose logs
        if: failure()
        working-directory: demo
        run: docker compose logs
      - name: Run Playwright tests
        working-directory: demo
        run: npx playwright test
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: demo/playwright-report/
          retention-days: 30
